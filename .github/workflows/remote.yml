name: Remote SSH Session
run-name: Remote Sesssion on ${{ inputs.Technique }} @ ${{ inputs.RunnerMachine }}

on:
  workflow_dispatch:
    inputs:
      RunnerMachine:
        description: "Runner OS/Machine"
        required: false
        type: choice
        options:
        - ubuntu-26.04
        - ubuntu-24.04
        - ubuntu-22.04
        - ubuntu-26.04-arm
        - ubuntu-24.04-arm
        - ubuntu-22.04-arm
        - ubuntu-slim
        - windows-2025
        - windows-2022
        - windows-11-arm
        - xcode-27
        - macos-26-intel
        - macos-26
        - macos-15-intel
        - macos-15
        default: ubuntu-24.04
      Technique:
        description: "Technique to use for SSH"
        required: false
        type: choice
        options:
        - tmate
        - upterm
        default: tmate
      ScriptURL:
        description: "Script URL to Run before SSH"
        required: false
        default: ""
        type: string

defaults:
  run:
    shell: bash

jobs:
  debug:
    runs-on: ${{ github.event.inputs.RunnerMachine }}

    env:
      ScriptURL: ${{ github.event.inputs.ScriptURL }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          show-progress: false
      - name: Set Git Configs & Secrets
        uses: rokibhasansagar/custom_workflows/git_config@main
        with:
          credential: "yes"
        env:
          PAT: ${{ secrets.GH_TOKEN }}

      - name: PreSSH Script Runner
        continue-on-error: true
        if: env.ScriptURL != ''
        run: |
          if grep -q "\?" <<<"${ScriptURL}"; then
            export ParamEnvs="${ScriptURL##*\?}"
            export AddedEnvs=(env ${ParamEnvs//&/ })
          fi
          curl -sL --retry 5 --retry-connrefused "${ScriptURL%\?*}" | ${AddedEnvs[@]:-} bash

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Setup tmate session
        if: github.event.inputs.Technique == 'tmate'
        uses: mxschmitt/action-tmate@v3

      - name: Setup upterm session
        if: github.event.inputs.Technique == 'upterm'
        uses: owenthereal/action-upterm@v1

